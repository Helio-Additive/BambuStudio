name: Build all

on:
  pull_request:
    branches: [pr71-merge-261021-bambu-master]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA in the Helio fork to compile and smoke-test
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: ubuntu-22.04, os: ubuntu-22.04, deps: '12331267782'}
          - {target: ubuntu-24.04, os: ubuntu-24.04, deps: '12330821811'}
          - {target: ubuntu-26.04, os: ubuntu-26.04, deps: '12331372971'}
          - {target: windows-x64, os: windows-latest, arch: x64, deps: '12332425413'}
          - {target: windows-arm64, os: windows-11-arm, arch: ARM64, deps: '12402494550'}
          - {target: windows-arm64ec, os: windows-11-arm, arch: ARM64EC, deps: '12333929345'}
          - {target: macos-15-intel, os: macos-15-intel, arch: x86_64, deps: '12345008801'}
          - {target: macos-15-arm64, os: macos-15, arch: arm64, deps: '12338627471'}
          - {target: macos-26-arm64, os: macos-26, arch: arm64, deps: '12341243239'}
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      SOURCE_SHA: ${{ github.event.pull_request.base.sha || inputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          path: harness
          persist-credentials: false
      - name: Verify candidate commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Candidate commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      # This run built the same candidate successfully before the Windows test configuration changed.
      - name: Find previously built candidate package
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45169027722/artifacts?per_page=100" \
            | jq -r --arg name "BambuStudio-$TARGET-$SOURCE_SHA" '.artifacts[] | select(.name == $name and (.expired | not)) | .id')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Download previously built candidate package
        if: steps.previous.outputs.id != ''
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 45169027722
          artifact-ids: ${{ steps.previous.outputs.id }}
          path: packages
          merge-multiple: true
      - name: Prepare Linux runtime for package check
        if: runner.os == 'Linux' && steps.previous.outputs.id != ''
        run: |
          sudo ./BuildLinux.sh -ur
          sudo apt-get install -y xvfb xauth
      - name: Restore dependency bundle
        if: steps.previous.outputs.id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS_ARTIFACT: ${{ matrix.deps }}
        run: python3 harness/.github/scripts/restore-test-deps.py
        shell: bash
      - name: Configure macOS build tools
        if: runner.os == 'macOS' && steps.previous.outputs.id == ''
        shell: bash
        run: |
          python3 harness/.github/scripts/relocate-mac-metadata.py .
          brew install automake texinfo
          python3 -m venv "$RUNNER_TEMP/cmake-331"
          "$RUNNER_TEMP/cmake-331/bin/pip" install cmake==3.31.0.1
          echo "$RUNNER_TEMP/cmake-331/bin" >> "$GITHUB_PATH"
      - name: Build and package macOS application
        if: runner.os == 'macOS' && steps.previous.outputs.id == ''
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=3 ./BuildMac.sh -s -x -a "$ARCH" -t 10.15
          app="build/$ARCH/BambuStudio/BambuStudio.app"
          mkdir -p packages
          ditto -c -k --sequesterRsrc --keepParent "$app" "packages/BambuStudio-$TARGET.zip"
      - name: Build and package Linux application
        if: runner.os == 'Linux' && steps.previous.outputs.id == ''
        shell: bash
        run: |
          sudo ./BuildLinux.sh -ur
          sudo apt-get install -y xvfb xauth
          sudo chown "$USER" -R .
          ./BuildLinux.sh -isfr
          mkdir -p packages
          cp build/BambuStudio_ubu64.AppImage "packages/BambuStudio-$TARGET.AppImage"
      - name: Build and package Windows application
        if: runner.os == 'Windows' && steps.previous.outputs.id == ''
        shell: pwsh
        run: |
          choco install nsis pkgconfiglite -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pkg = Get-ChildItem "$env:ChocolateyInstall/lib/pkgconfiglite" -Filter pkg-config.exe -Recurse -File | Select-Object -First 1
          if (!$pkg) { throw "Missing pkgconfiglite" }
          # Stage the exact Node archive used by DeviceWeb before configuring CMake.
          $cache = Join-Path (Split-Path $PWD.Path) "node-cache"
          New-Item -ItemType Directory -Force $cache | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "node-v22.22.2-win-x64.zip"
          Invoke-WebRequest https://nodejs.org/dist/v22.22.2/node-v22.22.2-win-x64.zip -OutFile $zip
          if ((Get-FileHash $zip).Hash -ne "7c93e9d92bf68c07182b471aa187e35ee6cd08ef0f24ab060dfff605fcc1c57c") { throw "Node checksum mismatch" }
          tar -xf $zip -C $cache
          if ($LASTEXITCODE -or !(Test-Path "$cache/node-v22.22.2-win-x64/node.exe")) { throw "Node extraction failed" }
          $instance = @()
          $generator = "Visual Studio 18 2026"
          if ($env:ARCH -ne "x64") {
            $toolchain = & ./harness/.github/scripts/select-arm64-toolchain.ps1
            $generator = $toolchain.Generator
            $instance = @("-DCMAKE_GENERATOR_INSTANCE=$($toolchain.InstallationPath)")
          }
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/Include" -Directory |
            Where-Object { $_.Name -match '^10\.' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$sdk) { throw "Missing Windows 10 SDK" }
          cmake -S . -B build -G $generator -A $env:ARCH @instance -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0 "-DCMAKE_PREFIX_PATH=$pwd/deps/build/BambuStudio_dep/usr/local" "-DCMAKE_INSTALL_PREFIX=$pwd/install-dir" "-DWIN10SDK_PATH=$($sdk.FullName)" "-DPKG_CONFIG_EXECUTABLE=$($pkg.FullName)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --target install --config Release -- -m
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force packages | Out-Null
          & "C:/Program Files/7-Zip/7z.exe" a -tzip "packages/BambuStudio-$env:TARGET.zip" install-dir
          exit $LASTEXITCODE
      - name: Upload desktop package
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio-${{ matrix.target }}-${{ env.SOURCE_SHA }}
          path: packages/
          if-no-files-found: error
      - name: Run Helio regression tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            # The standalone project does not inherit the desktop project's MSVC encoding.
            export CL=-utf-8
            export CMAKE_GENERATOR_PLATFORM="$ARCH"
          fi
          cmake -S tests/helio -B helio-tests
          cmake --build helio-tests --config Release
          ctest --test-dir helio-tests -C Release --output-on-failure
      - name: Smoke-test packaged Linux or macOS application
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir smoke
          cd smoke
          if [[ "$RUNNER_OS" == macOS ]]; then
            ditto -x -k "../packages/BambuStudio-$TARGET.zip" .
            ./BambuStudio.app/Contents/MacOS/BambuStudio --help > help.txt
          else
            image="../packages/BambuStudio-$TARGET.AppImage"
            chmod +x "$image"
            "$image" --appimage-extract > /dev/null
            xvfb-run -a ./squashfs-root/AppRun --help > help.txt
          fi
          grep -F 'Usage: bambu-studio' help.txt
      - name: Smoke-test packaged Windows application
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.upload.outcome == 'success' }}
        shell: pwsh
        run: |
          & "C:/Program Files/7-Zip/7z.exe" x "packages/BambuStudio-$env:TARGET.zip" -osmoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $app = Resolve-Path smoke/install-dir/bambu-studio.exe
          $process = Start-Process -FilePath $app -ArgumentList '--help' -PassThru
          if (!$process.WaitForExit(120000)) { $process.Kill(); throw "Application help timed out" }
          if ($process.ExitCode -ne 0) { throw "Application exited with $($process.ExitCode)" }
